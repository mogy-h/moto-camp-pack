<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-05df4399-2545-42d8-a736-030508ad6606/styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:'Figtree','Zen Maru Gothic',system-ui,sans-serif}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
a{color:var(--color-accent-700);text-decoration:none}
a:hover{color:var(--color-accent-600)}
button,input{font-family:inherit}
@keyframes popIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(20px,5vw,48px) clamp(16px,4vw,24px);background:radial-gradient(120% 60% at 50% 0%, #fbf4e6 0%, var(--color-bg) 62%)">

  <div style="width:100%;max-width:420px;animation:popIn .4s ease both">

    <div style="text-align:center;margin-bottom:clamp(22px,4vw,30px)">
      <div style="width:60px;height:60px;margin:0 auto 14px;border-radius:var(--radius-lg);background:var(--color-accent-600);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md)">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fdf8ef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.5" cy="17" r="3.2"></circle><circle cx="18.5" cy="17" r="3.2"></circle><path d="M8.7 17h6.1l-3.3-6.4H7.2M14.8 10.6h2.2l1.5 6.4M11.5 10.6l2-3.1h2.6"></path></svg>
      </div>
      <div style="font-family:'Caprasimo',serif;font-size:26px;color:var(--color-accent-700);line-height:1.1">MotoCamp Pack</div>
      <div style="font-size:13px;color:var(--color-neutral-700);margin-top:8px;line-height:1.6">キャンプツーリングの積載を、<br>メンバー全員で持ち寄る。</div>
    </div>

    <div style="background:var(--color-surface);border-radius:var(--radius-lg);border:1px solid var(--color-divider);box-shadow:var(--shadow-md);padding:clamp(20px,4vw,26px)">

      <div style="display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--color-neutral-200);margin-bottom:22px">
        <button type="button" onClick="{{ showLogin }}" style="{{ loginTabStyle }}">ログイン</button>
        <button type="button" onClick="{{ showSignup }}" style="{{ signupTabStyle }}">新規登録</button>
      </div>

      <div style="display:flex;flex-direction:column;gap:14px">

        <sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
          <label style="display:block">
            <span style="display:block;font-size:12px;font-weight:600;color:var(--color-neutral-800);margin-bottom:6px">表示名</span>
            <input value="{{ nameValue }}" onChange="{{ onName }}" placeholder="山田 太郎" style="{{ inputStyle }}" style-focus="background:var(--color-neutral-100);border-color:var(--color-accent-500)">
          </label>
        </sc-if>

        <label style="display:block">
          <span style="display:block;font-size:12px;font-weight:600;color:var(--color-neutral-800);margin-bottom:6px">メールアドレス</span>
          <input value="{{ emailValue }}" onChange="{{ onEmail }}" inputmode="email" placeholder="you@example.com" style="{{ inputStyle }}" style-focus="background:var(--color-neutral-100);border-color:var(--color-accent-500)">
        </label>

        <label style="display:block">
          <span style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12px;font-weight:600;color:var(--color-neutral-800);margin-bottom:6px">
            パスワード
            <sc-if value="{{ isLogin }}" hint-placeholder-val="{{ true }}">
              <a href="#" style="font-size:11.5px;font-weight:500">お忘れですか？</a>
            </sc-if>
          </span>
          <div style="position:relative;display:flex;align-items:center">
            <input value="{{ passValue }}" onChange="{{ onPass }}" type="{{ passType }}" placeholder="8文字以上" style="{{ passInputStyle }}" style-focus="background:var(--color-neutral-100);border-color:var(--color-accent-500)">
            <button type="button" onClick="{{ togglePass }}" aria-label="パスワードを表示" style="position:absolute;right:6px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--color-neutral-700);cursor:pointer;border-radius:999px" style-hover="background:var(--color-neutral-200)">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="2.8"></circle><path style="{{ slashStyle }}" d="M4 20L20 4"></path></svg>
            </button>
          </div>
          <sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
              <div style="flex:1;height:5px;border-radius:999px;background:var(--color-neutral-300);overflow:hidden">
                <div style="{{ strengthBarStyle }}"></div>
              </div>
              <span style="{{ strengthLabelStyle }}">{{ strengthLabel }}</span>
            </div>
          </sc-if>
        </label>

        <sc-if value="{{ isSignup }}" hint-placeholder-val="{{ false }}">
          <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:12px;color:var(--color-neutral-800);line-height:1.6">
            <button type="button" onClick="{{ toggleTerms }}" style="{{ checkStyle }}">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="{{ checkIconStyle }}"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
            </button>
            <span style="padding-top:2px"><a href="#">利用規約</a>と<a href="#">プライバシーポリシー</a>に同意します</span>
          </label>
        </sc-if>

        <button type="button" onClick="{{ submit }}" style="{{ submitStyle }}" style-hover="background:var(--color-accent-700)">{{ submitLabel }}</button>

        <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;gap:8px;align-items:flex-start;padding:11px 13px;border-radius:var(--radius-md);background:var(--color-accent-200);color:var(--color-accent-800);font-size:12.5px;line-height:1.6">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v4.5M12 16h.01"></path></svg>
            <span style="flex:1">{{ errorText }}</span>
          </div>
        </sc-if>

      </div>

      <div style="display:flex;align-items:center;gap:12px;margin:20px 0 16px">
        <span style="flex:1;height:1px;background:var(--color-divider)"></span>
        <span style="font-size:11px;color:var(--color-neutral-600);letter-spacing:.06em">または</span>
        <span style="flex:1;height:1px;background:var(--color-divider)"></span>
      </div>

      <div style="display:flex;flex-direction:column;gap:9px">
        <sc-for list="{{ providers }}" as="p" hint-placeholder-count="2">
          <button type="button" onClick="{{ p.onTap }}" style="display:flex;align-items:center;justify-content:center;gap:10px;height:46px;border-radius:999px;border:1px solid var(--color-neutral-300);background:var(--color-neutral-100);color:var(--color-neutral-800);font-size:13.5px;font-weight:600;cursor:pointer" style-hover="background:var(--color-neutral-200)">
            <span style="{{ p.dotStyle }}">{{ p.mark }}</span>
            {{ p.label }}
          </button>
        </sc-for>
      </div>

    </div>

    <div style="text-align:center;font-size:12.5px;color:var(--color-neutral-700);margin-top:18px;line-height:1.7">
      {{ switchPrompt }}
      <button type="button" onClick="{{ toggleMode }}" style="border:none;background:transparent;padding:0 2px;font-size:12.5px;font-weight:700;color:var(--color-accent-700);cursor:pointer;text-decoration:underline">{{ switchAction }}</button>
    </div>

    <div style="text-align:center;margin-top:22px">
      <a href="./MotoCamp Dashboard.dc.html" style="font-size:12px;color:var(--color-neutral-600)">招待リンクをお持ちの方はこちら →</a>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { mode: 'login', name: '', email: '', pass: '', show: false, terms: false, error: '' };

  input(extra) {
    return 'width:100%;height:46px;padding:0 14px;border-radius:var(--radius-md);border:1.5px solid var(--color-neutral-300);background:var(--color-neutral-200);color:var(--color-text);font-size:14.5px;outline:none;transition:border-color .15s,background .15s;' + (extra || '');
  }

  strength() {
    const p = this.state.pass;
    let s = 0;
    if (p.length >= 8) s++;
    if (/[A-Z]/.test(p) || /[^a-zA-Z0-9]/.test(p)) s++;
    if (p.length >= 12) s++;
    return p.length === 0 ? 0 : Math.max(1, s);
  }

  submit = () => {
    const { mode, email, pass, terms } = this.state;
    if (!email || !pass) return this.setState({ error: 'メールアドレスとパスワードを入力してください。' });
    if (mode === 'signup' && !terms) return this.setState({ error: '利用規約への同意が必要です。' });
    this.setState({ error: '' });
    window.location.href = './MotoCamp Dashboard.dc.html';
  };

  renderVals() {
    const { mode, show, terms, error } = this.state;
    const isSignup = mode === 'signup';
    const tab = (on) => 'flex:1;height:38px;border:none;border-radius:999px;font-size:13.5px;font-weight:' + (on ? '700' : '500') + ';cursor:pointer;transition:background .18s;background:' + (on ? 'var(--color-neutral-100)' : 'transparent') + ';color:' + (on ? 'var(--color-accent-700)' : 'var(--color-neutral-700)') + ';box-shadow:' + (on ? 'var(--shadow-sm)' : 'none');
    const s = this.strength();
    const sColors = ['var(--color-neutral-300)', '#c2563d', 'var(--color-accent-500)', 'var(--color-accent-2-600)'];
    const sLabels = ['', '弱い', 'まあまあ', '強い'];

    return {
      isSignup, isLogin: !isSignup,
      loginTabStyle: tab(!isSignup),
      signupTabStyle: tab(isSignup),
      showLogin: () => this.setState({ mode: 'login', error: '' }),
      showSignup: () => this.setState({ mode: 'signup', error: '' }),
      toggleMode: () => this.setState({ mode: isSignup ? 'login' : 'signup', error: '' }),
      switchPrompt: isSignup ? 'すでにアカウントをお持ちですか？' : 'アカウントをお持ちでない方は',
      switchAction: isSignup ? 'ログイン' : '新規登録',

      inputStyle: this.input(),
      passInputStyle: this.input('padding-right:48px'),
      nameValue: this.state.name,
      emailValue: this.state.email,
      passValue: this.state.pass,
      onName: (e) => this.setState({ name: e.target.value }),
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPass: (e) => this.setState({ pass: e.target.value }),

      passType: show ? 'text' : 'password',
      togglePass: () => this.setState({ show: !show }),
      slashStyle: 'opacity:' + (show ? 0 : 1) + ';transition:opacity .15s',

      strengthBarStyle: 'height:100%;width:' + (s / 3) * 100 + '%;border-radius:999px;background:' + sColors[s] + ';transition:width .25s,background .25s',
      strengthLabel: sLabels[s] || '—',
      strengthLabelStyle: 'font-size:11px;font-weight:600;min-width:52px;text-align:right;color:' + (s ? sColors[s] : 'var(--color-neutral-600)'),

      toggleTerms: () => this.setState({ terms: !terms }),
      checkStyle: 'width:20px;height:20px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;transition:all .15s;border:1.5px solid ' + (terms ? 'var(--color-accent-600)' : 'var(--color-neutral-400)') + ';background:' + (terms ? 'var(--color-accent-600)' : 'var(--color-neutral-100)') + ';color:var(--color-neutral-100);padding:0',
      checkIconStyle: 'opacity:' + (terms ? 1 : 0) + ';transition:opacity .12s',

      submit: this.submit,
      submitLabel: isSignup ? 'アカウントを作成' : 'ログイン',
      submitStyle: 'height:50px;margin-top:4px;border-radius:999px;border:none;background:var(--color-accent-600);color:var(--color-neutral-100);font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm);transition:background .15s',

      showError: !!error,
      errorText: error,

      providers: [
        { key: 'g', label: 'Google で続ける', mark: 'G', onTap: this.submit, dotStyle: 'width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-family:"Caprasimo",serif;font-size:12px;background:var(--color-accent-200);color:var(--color-accent-800)' },
        { key: 'a', label: 'Apple で続ける', mark: '', onTap: this.submit, dotStyle: 'width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--color-neutral-800);color:var(--color-neutral-100)' }
      ]
    };
  }
}

</script>
</body>
</html>
