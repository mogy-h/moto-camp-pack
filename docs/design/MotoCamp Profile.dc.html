<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/organic-05df4399-2545-42d8-a736-030508ad6606/styles.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:'Figtree','Zen Maru Gothic',system-ui,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
input,button,textarea,select{box-sizing:border-box;font-family:inherit}
a{color:var(--color-accent-700);text-decoration:none}
a:hover{color:var(--color-accent-600)}
input{accent-color:var(--color-accent-600)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
@keyframes popIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</helmet>
<div style="min-height:100vh;background:radial-gradient(120% 50% at 50% 0%, #fbf4e6 0%, var(--color-bg) 60%)">

  <header style="position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--color-bg) 88%, transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--color-divider)">
    <div style="max-width:760px;margin:0 auto;padding:12px clamp(14px,3vw,28px);display:flex;align-items:center;gap:12px">
      <a href="./MotoCamp Dashboard.dc.html" aria-label="ダッシュボードへ戻る" style="flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:1px solid var(--color-neutral-300);color:var(--color-neutral-800)" style-hover="background:var(--color-surface)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"></path></svg>
      </a>
      <div style="flex:1;min-width:0;font-family:'Zen Maru Gothic','Figtree',sans-serif;font-size:16px">プロフィール設定</div>
      <button type="button" onClick="{{ save }}" style="{{ headSaveStyle }}" style-hover="background:var(--color-accent-700)">{{ headSaveLabel }}</button>
    </div>
  </header>

  <main style="max-width:760px;margin:0 auto;padding:clamp(20px,3vw,32px) clamp(14px,3vw,28px) 120px;display:flex;flex-direction:column;gap:clamp(16px,2.5vw,22px)">

    <section style="padding:clamp(18px,3vw,24px);border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-divider);box-shadow:var(--shadow-sm)">
      <div style="display:flex;gap:clamp(14px,2.5vw,20px);align-items:center;flex-wrap:wrap;margin-bottom:20px">
        <div style="flex:none;position:relative">
          <span style="width:74px;height:74px;border-radius:999px;background:var(--color-accent-2-600);color:var(--color-accent-2-100);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;box-shadow:var(--shadow-sm)">{{ initials }}</span>
          <button type="button" aria-label="写真を変更" style="position:absolute;right:-3px;bottom:-3px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:999px;border:2px solid var(--color-surface);background:var(--color-accent-600);color:var(--color-neutral-100);cursor:pointer" style-hover="background:var(--color-accent-700)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5h3l1.4-2h7.2L17 8.5h3v11H4z"></path><circle cx="12" cy="14" r="3"></circle></svg>
          </button>
        </div>
        <div style="flex:1 1 200px;min-width:0">
          <div style="font-family:'Zen Maru Gothic','Figtree',sans-serif;font-size:clamp(17px,2.4vw,20px);line-height:1.35">{{ displayName }}</div>
          <div style="font-size:12.5px;color:var(--color-neutral-700);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ emailValue }}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">
            <span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--color-accent-200);color:var(--color-accent-800)">参加中 3件</span>
            <span style="font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--color-accent-2-200);color:var(--color-accent-2-800)">走行 12回</span>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:14px">
        <label style="display:block">
          <span style="display:block;font-size:12px;font-weight:600;color:var(--color-neutral-800);margin-bottom:6px">表示名</span>
          <input value="{{ nameValue }}" onChange="{{ onName }}" placeholder="山田 拓也" style="{{ inputStyle }}" style-focus="background:var(--color-neutral-100);border-color:var(--color-accent-500)">
        </label>
        <label style="display:block">
          <span style="display:flex;align-items:baseline;gap:6px;font-size:12px;font-weight:600;color:var(--color-neutral-800);margin-bottom:6px">
            メールアドレス
            <span style="font-size:11px;font-weight:500;color:var(--color-neutral-600)">招待の送受信に使われます</span>
          </span>
          <input value="{{ emailValue }}" onChange="{{ onEmail }}" inputmode="email" style="{{ inputStyle }}" style-focus="background:var(--color-neutral-100);border-color:var(--color-accent-500)">
        </label>
      </div>
    </section>

    <section style="padding:clamp(18px,3vw,24px);border-radius:var(--radius-lg);background:var(--color-accent-2-100);border:1px solid var(--color-accent-2-200)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent-2-800)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="5.5" cy="17" r="3.2"></circle><circle cx="18.5" cy="17" r="3.2"></circle><path d="M8.7 17h6.1l-3.3-6.4H7.2M14.8 10.6h2.2l1.5 6.4M11.5 10.6l2-3.1h2.6"></path></svg>
        <span style="font-family:'Zen Maru Gothic','Figtree',sans-serif;font-size:15px;color:var(--color-accent-2-800)">バイクと積載装備</span>
      </div>
      <div style="font-size:12px;line-height:1.7;color:var(--color-accent-2-800);opacity:.9;margin-bottom:16px">ここの内容がイベントの「積載装備メモ」の初期値になり、他のメンバーから「誰に頑めそうか」の判断に使われます。</div>

      <label style="display:block;margin-bottom:16px">
        <span style="display:block;font-size:12px;font-weight:600;color:var(--color-accent-2-800);margin-bottom:6px">車種</span>
        <input value="{{ bikeValue }}" onChange="{{ onBike }}" placeholder="例）SEROW 250" style="{{ inputStyle }}" style-focus="background:var(--color-neutral-100);border-color:var(--color-accent-2-600)">
      </label>

      <div>
        <span style="display:block;font-size:12px;font-weight:600;color:var(--color-accent-2-800);margin-bottom:6px">積載装備のメモ</span>
        <input value="{{ carryValue }}" onChange="{{ onCarry }}" placeholder="例：リアキャリア＋40Lシートバッグ、サイドバッグなし" style="{{ inputStyle }}" style-focus="background:var(--color-neutral-100);border-color:var(--color-accent-2-600)">
        <div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:10px">
          <sc-for list="{{ carryPresets }}" as="c" hint-placeholder-count="6">
            <button type="button" onClick="{{ c.onAdd }}" style="{{ c.style }}" style-hover="background:var(--color-surface)">＋{{ c.label }}</button>
          </sc-for>
        </div>
        <div style="display:flex;gap:9px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:var(--radius-md);background:color-mix(in srgb, var(--color-surface) 70%, transparent)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--color-neutral-700)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="5.5" cy="17" r="3.2"></circle><circle cx="18.5" cy="17" r="3.2"></circle><path d="M8.7 17h6.1l-3.3-6.4H7.2M14.8 10.6h2.2l1.5 6.4M11.5 10.6l2-3.1h2.6"></path></svg>
          <span style="flex:1;font-size:12px;line-height:1.6;color:var(--color-neutral-800)">{{ summary }}</span>
        </div>
      </div>
    </section>

    <section style="padding:clamp(18px,3vw,24px);border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-divider)">
      <div style="font-family:'Zen Maru Gothic','Figtree',sans-serif;font-size:15px;margin-bottom:14px">通知</div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ toggles }}" as="t" hint-placeholder-count="3">
          <button type="button" onClick="{{ t.onTap }}" aria-pressed="{{ t.on }}" style="display:flex;align-items:center;gap:14px;width:100%;padding:12px 6px;border:none;background:transparent;text-align:left;cursor:pointer;border-radius:var(--radius-md)" style-hover="background:var(--color-neutral-200)">
            <span style="flex:1;min-width:0">
              <span style="display:block;font-size:13.5px;font-weight:600;color:var(--color-neutral-900)">{{ t.label }}</span>
              <span style="display:block;font-size:11.5px;line-height:1.6;color:var(--color-neutral-700);margin-top:3px">{{ t.desc }}</span>
            </span>
            <span style="{{ t.trackStyle }}"><span style="{{ t.knobStyle }}"></span></span>
          </button>
        </sc-for>
      </div>
    </section>

    <section style="padding:clamp(18px,3vw,24px);border-radius:var(--radius-lg);background:var(--color-surface);border:1px solid var(--color-divider)">
      <div style="font-family:'Zen Maru Gothic','Figtree',sans-serif;font-size:15px;margin-bottom:14px">アカウント</div>
      <div style="display:flex;flex-direction:column;gap:2px">
        <button type="button" style="{{ rowStyle }}" style-hover="background:var(--color-neutral-200)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect x="4" y="10.5" width="16" height="9.5" rx="2.5"></rect><path d="M8 10.5V7.5a4 4 0 018 0v3"></path></svg>
          <span style="flex:1;text-align:left;font-size:13.5px;font-weight:600">パスワードを変更</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--color-neutral-600)" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M9 6l6 6-6 6"></path></svg>
        </button>
        <a href="./MotoCamp Auth.dc.html" style="{{ logoutRowStyle }}" style-hover="background:var(--color-accent-100)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M15 17l4-5-4-5M19 12H9M11 4H6.5A1.5 1.5 0 005 5.5v13A1.5 1.5 0 006.5 20H11"></path></svg>
          <span style="flex:1;text-align:left;font-size:13.5px;font-weight:600">ログアウト</span>
        </a>
      </div>
      <div style="height:1px;background:var(--color-divider);margin:12px 4px"></div>
      <button type="button" style="display:flex;align-items:center;gap:10px;width:100%;padding:11px 6px;border:none;background:transparent;color:var(--color-neutral-700);font-size:12.5px;font-weight:600;cursor:pointer;border-radius:var(--radius-md)" style-hover="color:#a8422b">
        <span style="font-size:12.5px;font-weight:600">アカウントを削除する</span>
      </button>
    </section>

  </main>

  <sc-if value="{{ dirty }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:0;right:0;bottom:0;z-index:30;padding:14px clamp(14px,3vw,28px) calc(14px + env(safe-area-inset-bottom));background:color-mix(in srgb, var(--color-bg) 92%, transparent);backdrop-filter:blur(12px);border-top:1px solid var(--color-divider);animation:slideUp .2s ease both">
      <div style="max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span style="flex:1 1 140px;min-width:0;font-size:12.5px;color:var(--color-neutral-700)">未保存の変更があります</span>
        <button type="button" onClick="{{ reset }}" style="flex:none;height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--color-neutral-300);background:transparent;color:var(--color-neutral-800);font-size:13.5px;font-weight:600;cursor:pointer" style-hover="background:var(--color-surface)">元に戻す</button>
        <button type="button" onClick="{{ save }}" style="flex:none;height:44px;padding:0 24px;border-radius:999px;border:none;background:var(--color-accent-600);color:var(--color-neutral-100);font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-sm)" style-hover="background:var(--color-accent-700)">変更を保存</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}">
    <div style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:9px;padding:12px 20px;border-radius:999px;background:var(--color-accent-2-700);color:var(--color-accent-2-100);font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:slideUp .2s ease both">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
      プロフィールを保存しました
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const SAVED = { name: '山田 拓也', email: 'takuya@example.com', bike: 'SEROW 250', carry: 'リアキャリア＋40Lシートバッグ、長物は横積み可' };
const CARRY_PRESETS = ['トップケース', 'サイドバッグ', 'シートバッグ', 'リアキャリア', 'タンクバッグ', '長物OK'];

class Component extends DCLogic {
  state = { ...SAVED, base: { ...SAVED }, saved: false, notif: { invite: true, packing: true, carry: true } };

  set(k) { return (e) => this.setState({ [k]: e.target.value, saved: false }); }

  renderVals() {
    const { name, email, bike, carry, base, notif } = this.state;
    const input = 'width:100%;height:46px;padding:0 14px;border-radius:var(--radius-md);border:1.5px solid var(--color-neutral-300);background:var(--color-neutral-200);color:var(--color-text);font-size:14.5px;outline:none;transition:border-color .15s,background .15s';
    const dirty = ['name', 'email', 'bike', 'carry'].some(k => this.state[k] !== base[k]);

    const notifDef = [
      { key: 'invite', label: 'イベントへの招待', desc: '仲間からイベントに招待されたときに通知します' },
      { key: 'packing', label: '積み込みの進捗', desc: 'メンバーが担当装備をパッキングしたときに通知します' },
      { key: 'carry', label: '貸し借り・運搬の依頼', desc: '自分に運搬や貸し出しの確認が来たときに知らせます' }
    ];

    const row = 'display:flex;align-items:center;gap:10px;width:100%;padding:12px 6px;border:none;border-radius:var(--radius-md);background:transparent;font-size:13.5px;font-weight:600;cursor:pointer;transition:background .13s;color:var(--color-neutral-900)';

    return {
      initials: (name.replace(/\s+/g, '').slice(0, 2) || 'ME').toUpperCase(),
      displayName: name || '名前未設定',
      nameValue: name, emailValue: email, bikeValue: bike, carryValue: carry,
      onName: this.set('name'), onEmail: this.set('email'), onBike: this.set('bike'), onCarry: this.set('carry'),
      inputStyle: input,

      carryPresets: CARRY_PRESETS.map(p => ({
        key: p, label: p,
        onAdd: () => this.setState(st => ({ carry: st.carry.trim() ? st.carry.trim() + '、' + p : p, saved: false })),
        style: 'height:34px;padding:0 13px;border-radius:999px;cursor:pointer;font-size:12px;font-weight:600;transition:background .13s;border:1px dashed var(--color-neutral-400);background:transparent;color:var(--color-neutral-800)'
      })),
      summary: (bike || '車種未設定') + '｜' + (carry.trim() || '積載装備は未登録'),

      toggles: notifDef.map(n => {
        const on = !!notif[n.key];
        return {
          key: n.key, label: n.label, desc: n.desc, on,
          onTap: () => this.setState({ notif: { ...notif, [n.key]: !on } }),
          trackStyle: 'flex:none;width:44px;height:26px;border-radius:999px;padding:3px;display:flex;align-items:center;justify-content:' + (on ? 'flex-end' : 'flex-start') + ';transition:background .18s;background:' + (on ? 'var(--color-accent-600)' : 'var(--color-neutral-300)'),
          knobStyle: 'width:20px;height:20px;border-radius:999px;background:var(--color-neutral-100);box-shadow:var(--shadow-sm);transition:transform .18s'
        };
      }),

      rowStyle: row,
      logoutRowStyle: row.replace('color:var(--color-neutral-900)', 'color:var(--color-accent-700)') + ';text-decoration:none',

      dirty,
      saved: this.state.saved,
      headSaveLabel: dirty ? '保存' : '保存済み',
      headSaveStyle: 'flex:none;height:38px;padding:0 18px;border-radius:999px;border:none;font-size:13px;font-weight:700;transition:background .15s;cursor:' + (dirty ? 'pointer' : 'default') + ';background:' + (dirty ? 'var(--color-accent-600)' : 'var(--color-neutral-300)') + ';color:' + (dirty ? 'var(--color-neutral-100)' : 'var(--color-neutral-700)'),
      save: () => {
        if (!dirty) return;
        this.setState({ base: { name, email, bike, carry }, saved: true });
        setTimeout(() => this.setState({ saved: false }), 2200);
      },
      reset: () => this.setState({ ...base, saved: false })
    };
  }
}

</script>
</body>
</html>
